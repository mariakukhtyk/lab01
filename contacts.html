    <main id="main" class="container content">
        <h1>Зворотний зв'язок</h1>

        <form action="https://httpbin.org/post" method="post">
            <p class="field--required">
                <label for="name">Ім'я</label><br>
                <input type="text" id="name" name="name" required>
            </p>

            <p class="field--required">
                <label for="email">Електронна пошта</label><br>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="subject">Тема звернення</label><br>
                <select id="subject" name="subject">
                    <option value="question">Запитання</option>
                    <option value="suggestion">Пропозиція</option>
                </select>
            </p>

            <p class="field--required">
                <label for="message">Повідомлення</label><br>
                <textarea id="message" name="message" rows="4" cols="30" required></textarea>
            </p>

            <p class="field--required">
                <label>
                    <input type="checkbox" name="agree" required>
                    Погоджуюсь на обробку персональних даних
                </label>
            </p>

            <button type="submit">Надіслати</button>
        </form>
    </main>
